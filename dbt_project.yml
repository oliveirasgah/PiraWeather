name: piraweather
version: "1.0.0"
config-version: 2

profile: piraweather

model-paths: ["models"]
# tests/ also holds Python pytest files; point dbt at a dedicated subdir so
# its glob doesn't pick up .sql files unintentionally and so the two test
# kinds stay visually separated.
test-paths: ["tests/dbt_singular"]
macro-paths: ["macros"]
seed-paths: ["seeds"]

models:
  piraweather:
    bronze:
      +schema: bronze
      +materialized: table
    silver:
      +schema: silver
      +materialized: table
    gold:
      +schema: gold
      +materialized: view

seeds:
  piraweather:
    +schema: gold

vars:
  first_year: 1997
